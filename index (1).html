<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintWear Tote Cost Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .summary-card h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .summary-card .amount {
            font-size: 36px;
            font-weight: bold;
        }
        
        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        
        .input-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .radio-option label {
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }
        
        .breakdown {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }
        
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .breakdown-item:last-child {
            border-bottom: none;
            font-weight: bold;
            font-size: 18px;
            padding-top: 15px;
        }
        
        .breakdown-item span:first-child {
            color: #666;
        }
        
        .breakdown-item span:last-child {
            color: #333;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function CostCalculator() {
            // Hard Costs
            const [bagProduction, setBagProduction] = useState(15);
            const [rawCanvas, setRawCanvas] = useState(8);
            const [lining, setLining] = useState(3);
            const [straps, setStraps] = useState(4);
            const [manufacturerPay, setManufacturerPay] = useState(10);
            const [imagePrinting, setImagePrinting] = useState(2);
            const [canvasTransport, setCanvasTransport] = useState(1.5);

            // Distribution Channel
            const [channel, setChannel] = useState('shipping'); // 'shipping' or 'artfairs'
            
            // Shipping costs (per bag)
            const [marketingMaterials, setMarketingMaterials] = useState(1);
            const [packingMaterials, setPackingMaterials] = useState(2);

            // Art Fair costs (total)
            const [tableFee, setTableFee] = useState(100);
            const [tableMaterials, setTableMaterials] = useState(50);

            // Sales
            const [bagsProduced, setBagsProduced] = useState(10);
            const [bagsSold, setBagsSold] = useState(10);
            const [pricePerBag, setPricePerBag] = useState(85);

            // Designer cut (as a decimal, e.g., 0.3 for 30%)
            const [designerCutPercent, setDesignerCutPercent] = useState(30);

            // Calculations
            const hardCostPerBag = bagProduction + rawCanvas + lining + straps + 
                                   manufacturerPay + imagePrinting + canvasTransport;
            
            const totalHardCosts = hardCostPerBag * bagsProduced;

            let distributionCosts = 0;
            if (channel === 'shipping') {
                distributionCosts = (marketingMaterials + packingMaterials) * bagsSold;
            } else {
                // Art fairs: table costs are split across bags sold, plus marketing per bag
                distributionCosts = tableFee + tableMaterials + (marketingMaterials * bagsSold);
            }

            const totalCosts = totalHardCosts + distributionCosts;
            const grossRevenue = pricePerBag * bagsSold;
            const netRevenueA = grossRevenue - totalCosts;
            const designerCut = netRevenueA * (designerCutPercent / 100);
            const trueNetRevenue = netRevenueA - designerCut;

            // Per bag metrics
            const costPerBagTotal = bagsSold > 0 ? totalCosts / bagsSold : 0;
            const profitPerBag = bagsSold > 0 ? trueNetRevenue / bagsSold : 0;

            return (
                <div className="container">
                    <div className="header">
                        <h1>PaintWear Tote Cost Calculator</h1>
                        <p>Track production costs, distribution channels, and net revenue</p>
                    </div>

                    <div className="content">
                        <div className="summary-cards">
                            <div className="summary-card">
                                <h3>Gross Revenue</h3>
                                <div className="amount">${grossRevenue.toFixed(2)}</div>
                            </div>
                            <div className="summary-card">
                                <h3>Total Costs</h3>
                                <div className="amount">${totalCosts.toFixed(2)}</div>
                            </div>
                            <div className="summary-card">
                                <h3>Net Revenue A</h3>
                                <div className="amount">${netRevenueA.toFixed(2)}</div>
                            </div>
                            <div className="summary-card">
                                <h3>True Net Revenue</h3>
                                <div className="amount">${trueNetRevenue.toFixed(2)}</div>
                            </div>
                        </div>

                        {/* Sales & Pricing */}
                        <div className="section">
                            <h2>💰 Sales & Pricing</h2>
                            <div className="input-grid">
                                <div className="input-group">
                                    <label>Bags Produced</label>
                                    <input
                                        type="number"
                                        value={bagsProduced}
                                        onChange={(e) => setBagsProduced(Number(e.target.value))}
                                        min="0"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Bags Sold</label>
                                    <input
                                        type="number"
                                        value={bagsSold}
                                        onChange={(e) => setBagsSold(Number(e.target.value))}
                                        min="0"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Price Per Bag ($)</label>
                                    <input
                                        type="number"
                                        value={pricePerBag}
                                        onChange={(e) => setPricePerBag(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Designer Cut (%)</label>
                                    <input
                                        type="number"
                                        value={designerCutPercent}
                                        onChange={(e) => setDesignerCutPercent(Number(e.target.value))}
                                        min="0"
                                        max="100"
                                        step="1"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Hard Costs */}
                        <div className="section">
                            <h2>🛠️ Hard Costs (Per Bag)</h2>
                            <div className="input-grid">
                                <div className="input-group">
                                    <label>Bag Production ($)</label>
                                    <input
                                        type="number"
                                        value={bagProduction}
                                        onChange={(e) => setBagProduction(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Raw Painted Canvas ($)</label>
                                    <input
                                        type="number"
                                        value={rawCanvas}
                                        onChange={(e) => setRawCanvas(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Lining ($)</label>
                                    <input
                                        type="number"
                                        value={lining}
                                        onChange={(e) => setLining(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Straps ($)</label>
                                    <input
                                        type="number"
                                        value={straps}
                                        onChange={(e) => setStraps(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Manufacturer Pay ($)</label>
                                    <input
                                        type="number"
                                        value={manufacturerPay}
                                        onChange={(e) => setManufacturerPay(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Image Printing ($)</label>
                                    <input
                                        type="number"
                                        value={imagePrinting}
                                        onChange={(e) => setImagePrinting(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                                <div className="input-group">
                                    <label>Canvas Transport ($)</label>
                                    <input
                                        type="number"
                                        value={canvasTransport}
                                        onChange={(e) => setCanvasTransport(Number(e.target.value))}
                                        min="0"
                                        step="0.01"
                                    />
                                </div>
                            </div>
                            <div className="breakdown">
                                <div className="breakdown-item">
                                    <span>Hard Cost Per Bag:</span>
                                    <span>${hardCostPerBag.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Total Hard Costs ({bagsProduced} bags):</span>
                                    <span>${totalHardCosts.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Distribution Channel */}
                        <div className="section">
                            <h2>📦 Distribution Channel</h2>
                            <div className="radio-group">
                                <div className="radio-option">
                                    <input
                                        type="radio"
                                        id="shipping"
                                        name="channel"
                                        value="shipping"
                                        checked={channel === 'shipping'}
                                        onChange={(e) => setChannel(e.target.value)}
                                    />
                                    <label htmlFor="shipping">Shipping</label>
                                </div>
                                <div className="radio-option">
                                    <input
                                        type="radio"
                                        id="artfairs"
                                        name="channel"
                                        value="artfairs"
                                        checked={channel === 'artfairs'}
                                        onChange={(e) => setChannel(e.target.value)}
                                    />
                                    <label htmlFor="artfairs">Art Fairs</label>
                                </div>
                            </div>

                            {channel === 'shipping' ? (
                                <div className="input-grid">
                                    <div className="input-group">
                                        <label>Marketing Materials (per bag) ($)</label>
                                        <input
                                            type="number"
                                            value={marketingMaterials}
                                            onChange={(e) => setMarketingMaterials(Number(e.target.value))}
                                            min="0"
                                            step="0.01"
                                        />
                                    </div>
                                    <div className="input-group">
                                        <label>Packing Materials (per bag) ($)</label>
                                        <input
                                            type="number"
                                            value={packingMaterials}
                                            onChange={(e) => setPackingMaterials(Number(e.target.value))}
                                            min="0"
                                            step="0.01"
                                        />
                                    </div>
                                </div>
                            ) : (
                                <div className="input-grid">
                                    <div className="input-group">
                                        <label>Marketing Materials (per bag) ($)</label>
                                        <input
                                            type="number"
                                            value={marketingMaterials}
                                            onChange={(e) => setMarketingMaterials(Number(e.target.value))}
                                            min="0"
                                            step="0.01"
                                        />
                                    </div>
                                    <div className="input-group">
                                        <label>Table Fee (total) ($)</label>
                                        <input
                                            type="number"
                                            value={tableFee}
                                            onChange={(e) => setTableFee(Number(e.target.value))}
                                            min="0"
                                            step="0.01"
                                        />
                                    </div>
                                    <div className="input-group">
                                        <label>Table Materials (total) ($)</label>
                                        <input
                                            type="number"
                                            value={tableMaterials}
                                            onChange={(e) => setTableMaterials(Number(e.target.value))}
                                            min="0"
                                            step="0.01"
                                        />
                                    </div>
                                </div>
                            )}

                            <div className="breakdown">
                                <div className="breakdown-item">
                                    <span>Total Distribution Costs:</span>
                                    <span>${distributionCosts.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Revenue Breakdown */}
                        <div className="section">
                            <h2>💵 Revenue Breakdown</h2>
                            <div className="breakdown">
                                <div className="breakdown-item">
                                    <span>Gross Revenue ({bagsSold} bags × ${pricePerBag}):</span>
                                    <span>${grossRevenue.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Total Costs:</span>
                                    <span>-${totalCosts.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Net Revenue A:</span>
                                    <span>${netRevenueA.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Designer Cut ({designerCutPercent}%):</span>
                                    <span>-${designerCut.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>True Net Revenue:</span>
                                    <span>${trueNetRevenue.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>

                        {/* Per Bag Metrics */}
                        <div className="section">
                            <h2>📊 Per Bag Metrics</h2>
                            <div className="breakdown">
                                <div className="breakdown-item">
                                    <span>Cost Per Bag (Total):</span>
                                    <span>${costPerBagTotal.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Profit Per Bag (After Designer Cut):</span>
                                    <span>${profitPerBag.toFixed(2)}</span>
                                </div>
                                <div className="breakdown-item">
                                    <span>Profit Margin:</span>
                                    <span>{pricePerBag > 0 ? ((profitPerBag / pricePerBag) * 100).toFixed(1) : 0}%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CostCalculator />);
    </script>
</body>
</html>
